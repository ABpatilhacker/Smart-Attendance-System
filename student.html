<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Dashboard | ERP</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="student.css">

  <!-- Chart -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- jsPDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>

<!-- 🔔 LIVE ALERT -->
<div id="liveAlert" class="alert-banner"></div>

<!-- SIDEBAR -->
<aside class="sidebar" id="sidebar">
  <h2>🎓 Student ERP</h2>
  <nav>
    <button onclick="showSection('dashboard')">🏠 Dashboard</button>
    <button onclick="showSection('classes')">📚 Subjects</button>
    <button onclick="showSection('attendance')">📊 Attendance</button>
    <button onclick="logout()">🚪 Logout</button>
  </nav>
</aside>

<div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

<!-- TOPBAR -->
<header class="topbar">
  <button class="menu-btn" onclick="toggleSidebar()">☰</button>
  <h1>Student Dashboard</h1>
</header>

<!-- MAIN -->
<main class="main">

<!-- DASHBOARD -->
<section id="dashboard" class="section active">

  <div class="card-grid">
    <div class="card">
      Subjects
      <span id="classCount">0</span>
    </div>
    <div class="card">
      Attendance
      <span id="attendancePercent">0%</span>
    </div>
    <div class="card">
      Monthly
      <span id="monthlySummary">--</span>
    </div>
    <div class="card">
      Prediction
      <span id="predictionText">--</span>
    </div>
  </div>

  <div class="chart-box">
    <canvas id="attendanceChart"></canvas>
  </div>

</section>

<!-- SUBJECTS -->
<section id="classes" class="section">
  <h2>Your Subjects</h2>
  <div id="classList" class="card-grid"></div>
</section>

<!-- ATTENDANCE -->
<section id="attendance" class="section">
  <h2>Attendance Record</h2>

  <select id="subjectSelect" onchange="loadSubjectAttendance()">
    <option value="">Select Subject</option>
  </select>

  <table>
    <thead>
      <tr>
        <th>Date</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody id="attendanceTableBody"></tbody>
  </table>

  <button class="export-btn" onclick="exportPDF()">📄 Export PDF</button>
</section>

</main>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script src="firebase.js"></script>

<!-- UI FIX -->
<script>
function toggleSidebar() {
  sidebar.classList.toggle("open");
  overlay.classList.toggle("show");
}
function showSection(id) {
  document.querySelectorAll(".section").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  sidebar.classList.remove("open");
  overlay.classList.remove("show");
}
</script>

<!-- APP -->
<script src="student.js"></script>
</body>
</html>
