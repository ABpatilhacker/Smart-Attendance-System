<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Attendance – Admin Dashboard</title>

<link rel="stylesheet" href="admin.css">

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyB3ytMC77uaEwdqmXgr1t-PN0z3qV_Dxi8",
  authDomain: "smart-attendance-system-17e89.firebaseapp.com",
  databaseURL: "https://smart-attendance-system-17e89-default-rtdb.firebaseio.com",
  projectId: "smart-attendance-system-17e89",
  storageBucket: "smart-attendance-system-17e89.firebasestorage.app",
  messagingSenderId: "168700970246",
  appId: "1:168700970246:web:392156387db81e92544a87"
};

</head>

<body>

<!-- TOP BAR -->
<header class="topbar">
  <div class="hamburger" onclick="toggleSidebar()">
    <span></span><span></span><span></span>
  </div>
  <div>
    <h1>Smart Attendance</h1>
    <p>Admin Dashboard</p>
  </div>
</header>

<!-- SIDEBAR -->
<aside class="sidebar">
  <button onclick="nav('dashboard')">📊 Dashboard</button>
  <button onclick="nav('classes')">🏫 Classes</button>
  <button onclick="nav('teachers')">👨‍🏫 Teachers</button>
  <button onclick="nav('approvals')">🟡 Approvals</button>
  <button onclick="nav('settings')">⚙️ Settings</button>
  <button class="danger" onclick="logout()">🚪 Logout</button>
</aside>

<!-- MAIN -->
<main>

<section id="dashboard" class="page active">
  <div class="stats">
    <div class="card"><h3>Classes</h3><span id="classCount">0</span></div>
    <div class="card"><h3>Teachers</h3><span id="teacherCount">0</span></div>
    <div class="card"><h3>Students</h3><span id="studentCount">0</span></div>
  </div>

  <div class="card">
    <h3>Attendance Overview</h3>
    <div class="progress"><div class="bar"></div></div>
  </div>
</section>

<section id="classes" class="page">
  <h2>Classes</h2>
  <input id="className" placeholder="Class name">
  <button onclick="addClass()">Add Class</button>
  <ul id="classList"></ul>
</section>

<section id="teachers" class="page">
  <h2>Teachers</h2>
  <button onclick="addTeacher()">+ Add Teacher</button>
  <ul id="teacherList"></ul>
</section>

<section id="approvals" class="page">
  <h2>Pending Approvals</h2>
  <ul id="pendingList"></ul>
</section>

<section id="settings" class="page">
  <div class="settings-card">
    <h3>Attendance Rules</h3>
    <p class="muted">
      Students must meet minimum attendance to be eligible.
    </p>
    <input id="minAttendance" type="number">
    <button onclick="saveSettings()">Save</button>
  </div>
</section>

</main>

<!-- PANELS -->
<div id="classPanel" class="panel"></div>
<div id="teacherProfile" class="panel"></div>

<!-- MODAL -->
<div id="modal" class="modal">
  <div class="modal-box">
    <h3 id="modalTitle"></h3>
    <p id="modalText"></p>
    <button id="modalOk">Confirm</button>
    <button onclick="closeModal()">Cancel</button>
  </div>
</div>

<script src="admin.js"></script>
</body>
</html>
