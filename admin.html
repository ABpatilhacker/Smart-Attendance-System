<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Google Icons -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="admin.css">
</head>
<body>

<!-- ================= SIDEBAR ================= -->
<div class="sidebar">
  <h2>Admin Panel</h2>

  <a href="#" onclick="nav('dashboard')">Dashboard</a>
  <a href="#" onclick="nav('approvals')">Approvals</a>
  <a href="#" onclick="nav('classes')">Classes</a>
  <a href="#" onclick="nav('teachers')">Teachers</a>
  <a href="#" onclick="nav('settings')">Settings</a>

  <a href="#" class="danger" onclick="logout()">Logout</a>
</div>

<!-- ================= MAIN ================= -->
<div class="main">

  <!-- DASHBOARD -->
  <section id="dashboard" class="page active">
    <h2>Dashboard</h2>

    <div class="stats">
      <div class="card stat">
        <h3 id="classCount">0</h3>
        <p>Classes</p>
      </div>
      <div class="card stat">
        <h3 id="teacherCount">0</h3>
        <p>Teachers</p>
      </div>
      <div class="card stat">
        <h3 id="studentCount">0</h3>
        <p>Students</p>
      </div>
    </div>
  </section>

  <!-- APPROVALS -->
  <section id="approvals" class="page">
    <h2>Pending Approvals</h2>
    <ul class="list" id="pendingList"></ul>
  </section>

  <!-- CLASSES -->
  <section id="classes" class="page">
    <h2>Classes</h2>

    <div style="display:flex; gap:10px; margin-bottom:15px;">
      <input id="className" placeholder="Enter class name">
      <button onclick="addClass()">Add</button>
    </div>

    <ul class="list" id="classList"></ul>
  </section>

  <!-- TEACHERS -->
  <section id="teachers" class="page">
    <h2>Teachers</h2>

    <button onclick="addTeacher()" style="margin-bottom:15px;">Add Teacher</button>

    <ul class="list" id="teacherList"></ul>
  </section>

  <!-- SETTINGS -->
  <section id="settings" class="page">
    <h2>Settings</h2>

    <label>Minimum Attendance (%)</label>
    <input id="minAttendance" type="number">

    <button onclick="saveSettings()">Save</button>
  </section>

</div>

<!-- ================= PANELS ================= -->
<div class="panel" id="classPanel"></div>
<div class="panel" id="teacherProfile"></div>
<div class="panel-overlay" onclick="closePanel('classPanel'); closePanel('teacherProfile')"></div>

<!-- ================= MODAL ================= -->
<div class="modal" id="modal">
  <div class="modal-box">
    <h3 id="modalTitle"></h3>
    <p id="modalText" class="muted"></p>

    <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:15px;">
      <button onclick="closeModal()">Cancel</button>
      <button class="danger" id="modalOk">Confirm</button>
    </div>
  </div>
</div>
