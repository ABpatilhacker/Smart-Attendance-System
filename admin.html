<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Smart Attendance – Admin Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

  <!-- CSS -->
  <link rel="stylesheet" href="admin.css">
</head>
<body>

<!-- 🍔 HAMBURGER -->
<button class="hamburger" onclick="toggleSidebar()">☰</button>

<!-- 📌 SIDEBAR -->
<aside class="sidebar">
  <h2 class="logo">Smart Attendance</h2>
  <nav>
    <button onclick="nav('dashboard')">📊 Dashboard</button>
    <button onclick="nav('classes')">🏫 Classes</button>
    <button onclick="nav('teachers')">👨‍🏫 Teachers</button>
    <button onclick="nav('approvals')">🟡 Approvals</button>
    <button onclick="nav('settings')">⚙️ Settings</button>
    <button class="danger" onclick="logout()">🚪 Logout</button>
  </nav>
</aside>

<!-- 📦 MAIN CONTENT -->
<main class="content">

  <!-- 📊 DASHBOARD -->
  <section id="dashboard" class="page active">
    <h1>Admin Dashboard</h1>

    <div class="cards">
      <div class="card">
        <h3>Classes</h3>
        <span id="classCount">0</span>
      </div>
      <div class="card">
        <h3>Teachers</h3>
        <span id="teacherCount">0</span>
      </div>
      <div class="card">
        <h3>Students</h3>
        <span id="studentCount">0</span>
      </div>
    </div>
  </section>

  <!-- 🏫 CLASSES -->
  <section id="classes" class="page">
    <h1>Classes</h1>

    <div class="add-bar">
      <input id="className" placeholder="New class name">
      <button onclick="addClass()">Add Class</button>
    </div>

    <ul id="classList" class="list"></ul>
  </section>

  <!-- 👨‍🏫 TEACHERS -->
  <section id="teachers" class="page">
    <h1>Teachers</h1>
    <button onclick="addTeacher()">➕ Add Teacher</button>
    <ul id="teacherList" class="list"></ul>
  </section>

  <!-- 🟡 APPROVALS -->
  <section id="approvals" class="page">
    <h1>Pending Approvals</h1>
    <ul id="pendingList" class="list"></ul>
  </section>

  <!-- ⚙️ SETTINGS -->
  <section id="settings" class="page">
    <h1>Settings</h1>

    <label>Minimum Attendance (%)</label>
    <input id="minAttendance" type="number" min="0" max="100">
    <p class="muted">
      Students below this percentage will be marked as defaulters.
    </p>

    <button onclick="saveSettings()">Save Settings</button>
  </section>

</main>

<!-- 📦 PANELS -->
<div id="classPanel" class="panel"></div>
<div id="teacherProfile" class="panel"></div>

<!-- ❓ CONFIRM MODAL -->
<div id="modal" class="modal">
  <div class="modal-box">
    <h3 id="modalTitle"></h3>
    <p id="modalText"></p>
    <div class="actions">
      <button id="modalOk">Confirm</button>
      <button onclick="modal.classList.remove('show')">Cancel</button>
    </div>
  </div>
</div>

<!-- 🔥 FIREBASE CONFIG -->
<script>
  const firebaseConfig = {
    apiKey: "YOUR_KEY",
    authDomain: "YOUR_DOMAIN",
    databaseURL: "YOUR_DB_URL",
    projectId: "YOUR_ID",
    storageBucket: "YOUR_BUCKET",
    messagingSenderId: "YOUR_SENDER",
    appId: "YOUR_APP_ID"
  };
</script>

<!-- JS -->
<script src="admin.js"></script>

</body>
</html>
