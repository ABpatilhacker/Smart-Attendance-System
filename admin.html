
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Smart Attendance – Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Firebase v8 -->
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

  <link rel="stylesheet" href="admin.css">
</head>

<body>

<!-- ================= TOP BAR ================= -->
<header class="topbar">
  <button class="hamburger" onclick="toggleSidebar()">☰</button>
  <h1>Smart Attendance</h1>
  <button class="logout" onclick="logout()">Logout</button>
</header>

<!-- ================= SIDEBAR ================= -->
<aside class="sidebar" id="sidebar">
  <button onclick="nav('dashboard', this)">📊 Dashboard</button>
  <button onclick="nav('classes', this)">🏫 Classes</button>
  <button onclick="nav('teachers', this)">👩‍🏫 Teachers</button>
  <button onclick="nav('approvals', this)">✅ Approvals</button>
  <button onclick="nav('settings', this)">⚙ Settings</button>
</aside>

<!-- ================= MAIN CONTENT ================= -->
<main class="content" id="content">

  <!-- DASHBOARD -->
  <section id="dashboard" class="page active">
    <div class="cards">
      <div class="card">
        <h3>Classes</h3>
        <span id="classCount">0</span>
      </div>
      <div class="card">
        <h3>Teachers</h3>
        <span id="teacherCount">0</span>
      </div>
      <div class="card">
        <h3>Students</h3>
        <span id="studentCount">0</span>
      </div>
    </div>
  </section>

  <!-- CLASSES -->
  <section id="classes" class="page">
    <h2>Classes</h2>

    <div class="glass-box">
      <input id="className" placeholder="Enter class name">
      <button onclick="addClass()">Add Class</button>
    </div>

    <ul id="classList" class="list">
      <!-- example -->
      <!--
      <li>
        FY BCA
        <button onclick="openPanel('classPanel')">View / Edit</button>
      </li>
      -->
    </ul>
  </section>

  <!-- TEACHERS -->
  <section id="teachers" class="page">
    <h2>Teachers</h2>
    <ul id="teacherList" class="list">
      <!--
      <li>
        Rahul Sharma
        <button onclick="openPanel('teacherPanel')">View</button>
      </li>
      -->
    </ul>
  </section>

  <!-- APPROVALS -->
  <section id="approvals" class="page">
    <h2>Pending Approvals</h2>
    <ul id="pendingList" class="list"></ul>
  </section>

  <!-- SETTINGS -->
  <section id="settings" class="page">
    <h2>Settings</h2>

    <div class="glass-box">
      <label>Minimum Attendance %</label>
      <input id="minAttendance" type="number" min="0" max="100">
      <button onclick="saveSettings()">Save Settings</button>
    </div>
  </section>

</main>

<!-- ================= OVERLAY ================= -->
<div id="overlay" class="overlay" onclick="closePanel()"></div>

<!-- ================= CLASS PANEL ================= -->
<div id="classPanel" class="side-panel">
  <h3>Edit Class</h3>
  <input id="editClassName" placeholder="Class name">
  <button onclick="saveClass()">Save</button>
  <button onclick="closePanel()">Close</button>
</div>

<!-- ================= TEACHER PANEL ================= -->
<div id="teacherPanel" class="side-panel">
  <h3>Teacher Profile</h3>
  <p id="teacherName">Name</p>
  <p id="teacherEmail">Email</p>
  <button onclick="closePanel()">Close</button>
</div>

<!-- ================= MODAL ================= -->
<div id="modal" class="modal">
  <div class="modal-box">
    <h3 id="modalTitle"></h3>
    <p id="modalText"></p>
    <button id="modalOk" onclick="closeModal()">OK</button>
  </div>
</div>

<!-- ================= BASIC UI JS (DO NOT REMOVE) ================= -->
<script>
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
}

function nav(id, btn) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(id).classList.add('active');

  document.querySelectorAll('.sidebar button').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');

  document.getElementById('sidebar').classList.remove('open');
}

function openPanel(id) {
  document.getElementById('overlay').classList.add('show');
  document.getElementById(id).classList.add('open');
}

function closePanel() {
  document.getElementById('overlay').classList.remove('show');
  document.querySelectorAll('.side-panel').forEach(p => p.classList.remove('open'));
}

function closeModal() {
  document.getElementById('modal').style.display = 'none';
}
</script>
