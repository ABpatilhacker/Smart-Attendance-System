<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

  <link rel="stylesheet" href="admin.css">
</head>
<body>

<div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

<!-- SIDEBAR -->
<aside class="sidebar">
  <h2 class="logo">Admin</h2>
  <button onclick="nav('dashboard')" class="nav-btn active">Dashboard</button>
  <button onclick="nav('classes')" class="nav-btn">Classes</button>
  <button onclick="nav('teachers')" class="nav-btn">Teachers</button>
  <button onclick="nav('approvals')" class="nav-btn">Approvals</button>
  <button onclick="nav('settings')" class="nav-btn">Settings</button>
  <button onclick="logout()" class="danger">Logout</button>
</aside>

<!-- MAIN -->
<main class="main">

<header>
  <button class="menu" onclick="toggleSidebar()">☰</button>
  <h1>Admin Dashboard</h1>
</header>

<!-- DASHBOARD -->
<section id="dashboard" class="page active">
  <div class="stats">
    <div class="card"><h3 id="classCount">0</h3><p>Classes</p></div>
    <div class="card"><h3 id="teacherCount">0</h3><p>Teachers</p></div>
    <div class="card"><h3 id="studentCount">0</h3><p>Students</p></div>
  </div>
</section>

<!-- CLASSES -->
<section id="classes" class="page">
  <h2>Classes</h2>
  <div class="add-box">
    <input id="className" placeholder="New Class Name">
    <button onclick="addClass()">Add</button>
  </div>
  <ul id="classList" class="list"></ul>
</section>

<!-- TEACHERS -->
<section id="teachers" class="page">
  <h2>Teachers</h2>
  <ul id="teacherList" class="list"></ul>
</section>

<!-- APPROVALS -->
<section id="approvals" class="page">
  <h2>Pending Approvals</h2>
  <ul id="pendingList" class="list"></ul>
</section>

<!-- SETTINGS -->
<section id="settings" class="page">
  <h2>Settings</h2>
  <label>Minimum Attendance (%)</label>
  <input type="number" id="minAttendance">
  <button onclick="saveSettings()">Save</button>
</section>

</main>

<!-- SLIDE PANEL -->
<div id="classPanel" class="panel"></div>

<!-- MODAL -->
<div id="modal" class="modal">
  <div class="modal-box">
    <h3 id="modalTitle"></h3>
    <p id="modalText"></p>
    <button id="modalOk">OK</button>
  </div>
</div>

<script src="admin.js"></script>
</body>
</html>
