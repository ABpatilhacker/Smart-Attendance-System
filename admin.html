<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Smart Attendance – Admin Dashboard</title>

<link rel="stylesheet" href="admin.css">

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
</head>

<body>

<!-- 🍔 TOP BAR -->
<header class="topbar">
  <div class="hamburger" onclick="toggleSidebar()">
    <span></span><span></span><span></span>
  </div>
  <h1>Smart Attendance – Admin Dashboard</h1>
</header>

<!-- 📌 SIDEBAR -->
<aside class="sidebar">
  <h2>Admin</h2>
  <nav>
    <button onclick="nav('dashboard')">📊 Dashboard</button>
    <button onclick="nav('approvals')">🟡 Approvals</button>
    <button onclick="nav('classes')">🏫 Classes</button>
    <button onclick="nav('teachers')">👨‍🏫 Teachers</button>
    <button onclick="nav('settings')">⚙️ Settings</button>
    <button class="danger" onclick="logout()">🚪 Logout</button>
  </nav>
</aside>

<!-- 🌈 MAIN CONTENT -->
<main class="content">

  <!-- DASHBOARD -->
  <section id="dashboard" class="page active">
    <div class="cards">
      <div class="card">
        <h3>Classes</h3>
        <span id="classCount">0</span>
      </div>
      <div class="card">
        <h3>Teachers</h3>
        <span id="teacherCount">0</span>
      </div>
      <div class="card">
        <h3>Students</h3>
        <span id="studentCount">0</span>
      </div>
    </div>
  </section>

  <!-- APPROVALS -->
  <section id="approvals" class="page">
    <h2>Pending Approvals</h2>
    <ul id="pendingList" class="list"></ul>
  </section>

  <!-- CLASSES -->
  <section id="classes" class="page">
    <h2>Classes</h2>
    <div class="add-row">
      <input id="className" placeholder="Class name">
      <button onclick="addClass()">Add</button>
    </div>
    <ul id="classList" class="list"></ul>
  </section>

  <!-- TEACHERS -->
  <section id="teachers" class="page">
    <h2>Teachers</h2>
    <button onclick="addTeacher()">➕ Add Teacher</button>
    <ul id="teacherList" class="list"></ul>
  </section>

  <!-- SETTINGS -->
  <section id="settings" class="page">
    <h2>Attendance Settings</h2>
    <label>Minimum Attendance %</label>
    <input id="minAttendance" type="number">
    <button onclick="saveSettings()">Save</button>
  </section>

</main>

<!-- 🔲 PANELS -->
<div id="classPanel" class="panel"></div>
<div id="teacherProfile" class="panel"></div>

<!-- ❓ MODAL -->
<div id="modal" class="modal">
  <div class="modal-box">
    <h3 id="modalTitle"></h3>
    <p id="modalText"></p>
    <button id="modalOk">Confirm</button>
    <button onclick="closeModal()">Cancel</button>
  </div>
</div>

</body>
</html>
