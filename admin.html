<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Admin Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- GOOGLE FONT -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="admin.css">

  <!-- FIREBASE -->
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
</head>
<body>

<!-- ================= TOPBAR ================= -->
<div class="topbar">
  <button class="hamburger" onclick="toggleSidebar()">☰</button>
  <h1>Admin Dashboard</h1>
  <button class="logout" onclick="logout()">Logout</button>
</div>

<!-- ================= SIDEBAR ================= -->
<div class="sidebar">
  <button class="active" onclick="nav('dashboard')">📊 Dashboard</button>
  <button onclick="nav('classes')">🏫 Classes</button>
  <button onclick="nav('teachers')">👨‍🏫 Teachers</button>
  <button onclick="nav('approvals')">✅ Approvals</button>
  <button onclick="nav('settings')">⚙️ Settings</button>
</div>

<!-- ================= OVERLAY ================= -->
<div id="overlay" onclick="toggleSidebar()"></div>

<!-- ================= CONTENT ================= -->
<div class="content">

  <!-- ===== DASHBOARD ===== -->
  <div id="dashboard" class="page active">
    <div class="stats">
      <div class="stat-card">
        <h2 id="classCount">0</h2>
        <p>Total Classes</p>
      </div>
      <div class="stat-card">
        <h2 id="teacherCount">0</h2>
        <p>Total Teachers</p>
      </div>
      <div class="stat-card">
        <h2 id="studentCount">0</h2>
        <p>Total Students</p>
      </div>
    </div>
  </div>

  <!-- ===== CLASSES ===== -->
  <div id="classes" class="page">
    <h2>Classes</h2>

    <div class="glass-box">
      <input id="className" placeholder="Enter class name">
      <button class="primary" onclick="addClass()">➕ Add Class</button>
    </div>

    <ul id="classList"></ul>
  </div>

  <!-- ===== TEACHERS ===== -->
  <div id="teachers" class="page">
    <h2>Teachers</h2>
    <ul id="teacherList"></ul>
  </div>

  <!-- ===== APPROVALS ===== -->
  <div id="approvals" class="page">
    <h2>Pending Approvals</h2>
    <ul id="pendingList"></ul>
  </div>

  <!-- ===== SETTINGS ===== -->
  <div id="settings" class="page">
    <h2>Attendance Settings</h2>

    <div class="settings-box">
      <p class="muted">
        Minimum attendance percentage required for students to be eligible.
      </p>
      <input type="number" id="minAttendance" min="0" max="100">
      <button class="primary" onclick="saveSettings()">Save Settings</button>
    </div>
  </div>

</div>

<!-- ================= CLASS / TEACHER PANEL ================= -->
<div id="classPanel"></div>

<!-- ================= MODAL ================= -->
<div id="modal" class="modal">
  <div class="modal-box">
    <h3 id="modalTitle"></h3>
    <p id="modalText" class="muted"></p>
    <button id="modalOk" class="primary">OK</button>
  </div>
</div>

<!-- ================= JS ================= -->
<script src="admin.js"></script>

</body>
</html>
