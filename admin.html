<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Smart Attendance – Admin Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<link rel="stylesheet" href="admin.css">
</head>

<body>

<header class="topbar">
  <button class="hamburger" onclick="toggleSidebar()">☰</button>
  <h1>Smart Attendance – Admin Dashboard</h1>
  <button onclick="logout()">Logout</button>
</header>

<aside class="sidebar">
  <button onclick="nav('dashboard')">Dashboard</button>
  <button onclick="nav('classes')">Classes</button>
  <button onclick="nav('teachers')">Teachers</button>
  <button onclick="nav('approvals')">Approvals</button>
  <button onclick="nav('settings')">Settings</button>
</aside>

<main class="content">

<section id="dashboard" class="page">
  <div class="cards">
    <div class="card">Classes <span id="classCount">0</span></div>
    <div class="card">Teachers <span id="teacherCount">0</span></div>
    <div class="card">Students <span id="studentCount">0</span></div>
  </div>
</section>

<section id="classes" class="page">
  <h2>Classes</h2>
  <input id="className" placeholder="Class name">
  <button onclick="addClass()">Add Class</button>
  <ul id="classList"></ul>
</section>

<section id="teachers" class="page">
  <h2>Teachers</h2>
  <ul id="teacherList"></ul>
</section>

<section id="approvals" class="page">
  <h2>Pending Approvals</h2>
  <ul id="pendingList"></ul>
</section>

<section id="settings" class="page">
  <h2>Settings</h2>
  <label>Minimum Attendance %</label>
  <input id="minAttendance" type="number">
  <button onclick="saveSettings()">Save</button>
</section>

</main>

<div id="classPanel" class="panel"></div>
<div id="teacherProfile" class="panel"></div>

<div id="modal" class="modal">
  <h3 id="modalTitle"></h3>
  <p id="modalText"></p>
  <button id="modalOk">OK</button>
</div>

</body>
