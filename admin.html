
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Smart Attendance – Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Firebase v8 -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<link rel="stylesheet" href="admin.css">
</head>

<body>

<!-- TOP BAR -->
<header class="topbar">
  <button class="hamburger" onclick="toggleSidebar()">☰</button>
  <h1>Smart Attendance</h1>
  <button class="logout" onclick="logout()">Logout</button>
</header>

<!-- SIDEBAR -->
<aside class="sidebar">
  <button class="active" onclick="nav('dashboard')">📊 Dashboard</button>
  <button onclick="nav('classes')">🏫 Classes</button>
  <button onclick="nav('teachers')">👩‍🏫 Teachers</button>
  <button onclick="nav('approvals')">✅ Approvals</button>
  <button onclick="nav('settings')">⚙ Settings</button>
</aside>

<!-- 🔴 REQUIRED OVERLAY (THIS WAS MISSING EARLIER) -->
<div id="overlay" class="panel" onclick="toggleSidebar()"></div>

<!-- MAIN CONTENT -->
<main class="content sidebar-open">

  <!-- DASHBOARD -->
  <section id="dashboard" class="page active">
    <div class="cards">
      <div class="card">
        <h3>Classes</h3>
        <span id="classCount">0</span>
      </div>
      <div class="card">
        <h3>Teachers</h3>
        <span id="teacherCount">0</span>
      </div>
      <div class="card">
        <h3>Students</h3>
        <span id="studentCount">0</span>
      </div>
    </div>
  </section>

  <!-- CLASSES -->
  <section id="classes" class="page">
    <h2>Classes</h2>

    <div class="glass-box">
      <input id="className" type="text" placeholder="Enter class name">
      <button onclick="addClass()">Add Class</button>
    </div>

    <ul id="classList" class="list"></ul>
  </section>

  <!-- TEACHERS -->
  <section id="teachers" class="page">
    <h2>Teachers</h2>
    <ul id="teacherList" class="list"></ul>
  </section>

  <!-- APPROVALS -->
  <section id="approvals" class="page">
    <h2>Pending Approvals</h2>
    <ul id="pendingList" class="list"></ul>
  </section>

  <!-- SETTINGS -->
  <section id="settings" class="page">
    <h2>Settings</h2>

    <div class="glass-box">
      <label>Minimum Attendance %</label>
      <input id="minAttendance" type="number" min="0" max="100">
      <button onclick="saveSettings()">Save Settings</button>
    </div>
  </section>

</main>

<!-- CLASS PANEL -->
<div id="classPanel" class="panel"></div>

<!-- TEACHER PROFILE PANEL -->
<div id="teacherProfile" class="panel"></div>

<!-- CONFIRM MODAL -->
<div id="modal" class="modal">
  <div class="modal-box">
    <h3 id="modalTitle"></h3>
    <p id="modalText"></p>
    <button id="modalOk">OK</button>
  </div>
</div>

</body>
