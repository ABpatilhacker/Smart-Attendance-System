<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Admin Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <link rel="stylesheet" href="admin.css" />
</head>
<body>

<header class="topbar">
  <button class="menu-btn" onclick="toggleSidebar()">☰</button>
  <h1>Admin Dashboard</h1>
  <button class="logout" onclick="logout()">Logout</button>
</header>

<aside class="sidebar">
  <button onclick="nav('dashboard')">📊 Dashboard</button>
  <button onclick="nav('approvals')">🟡 Approvals</button>
  <button onclick="nav('classes')">🏫 Classes</button>
  <button onclick="nav('teachers')">👨‍🏫 Teachers</button>
  <button onclick="nav('settings')">⚙️ Settings</button>
</aside>

<main class="content">

  <!-- DASHBOARD -->
  <section id="dashboard" class="page">
    <div class="stats">
      <div class="card">Classes <span id="classCount">0</span></div>
      <div class="card">Teachers <span id="teacherCount">0</span></div>
      <div class="card">Students <span id="studentCount">0</span></div>
    </div>
  </section>

  <!-- APPROVALS -->
  <section id="approvals" class="page">
    <h2>Pending Approvals</h2>
    <ul id="pendingList" class="list"></ul>
  </section>

  <!-- CLASSES -->
  <section id="classes" class="page">
    <h2>Classes</h2>

    <div class="add-box">
      <input id="className" placeholder="Class name">
      <button onclick="addClass()">➕ Add</button>
    </div>

    <ul id="classList" class="list"></ul>
  </section>

  <!-- TEACHERS -->
  <section id="teachers" class="page">
    <h2>Teachers</h2>
    <ul id="teacherList" class="list"></ul>
  </section>

  <!-- SETTINGS -->
  <section id="settings" class="page">
    <h2>Settings</h2>
    <label>Minimum Attendance %</label>
    <input type="number" id="minAttendance">
    <button onclick="saveSettings()">Save</button>
  </section>

</main>

<!-- SLIDE PANEL -->
<div id="classPanel" class="side-panel"></div>

<!-- MODAL -->
<div id="modal" class="modal">
  <div class="modal-box">
    <h3 id="modalTitle"></h3>
    <p id="modalText"></p>
    <button id="modalOk">OK</button>
  </div>
</div>

<script src="admin.js"></script>
</body>
</html>
