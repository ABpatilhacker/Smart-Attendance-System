<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Smart Attendance – Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Firebase v8 -->
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

  <link rel="stylesheet" href="admin.css">
</head>
<body>

<header class="topbar">
  <button class="hamburger" onclick="toggleSidebar()">☰</button>
  <h1>Smart Attendance</h1>
  <button class="logout" onclick="logout()">Logout</button>
</header>

<aside class="sidebar" id="sidebar">
  <button onclick="nav('dashboard',this)">Dashboard</button>
  <button onclick="nav('classes',this)">Classes</button>
  <button onclick="nav('teachers',this)">Teachers</button>
  <button onclick="nav('approvals',this)">Approvals</button>
  <button onclick="nav('settings',this)">Settings</button>
</aside>

<main class="content">

  <section id="dashboard" class="page active">
    <div class="cards">
      <div class="card"><h3>Classes</h3><span id="classCount">0</span></div>
      <div class="card"><h3>Teachers</h3><span id="teacherCount">0</span></div>
      <div class="card"><h3>Students</h3><span id="studentCount">0</span></div>
    </div>
  </section>

  <section id="classes" class="page">
    <h2>Classes</h2>
    <div class="glass-box">
      <input id="className" placeholder="Class name">
      <button onclick="addClass()">Add</button>
    </div>
    <ul id="classList" class="list"></ul>
  </section>

  <section id="teachers" class="page">
    <h2>Teachers</h2>
    <ul id="teacherList" class="list"></ul>
  </section>

  <section id="approvals" class="page">
    <h2>Pending Approvals</h2>
    <ul id="pendingList" class="list"></ul>
  </section>

  <section id="settings" class="page">
    <h2>Settings</h2>
    <div class="glass-box">
      <p>Minimum attendance required for eligibility</p>
      <input id="minAttendance" type="number">
      <button onclick="saveSettings()">Save</button>
    </div>
  </section>

</main>

<div id="overlay" class="overlay" onclick="closeAll()"></div>

<!-- VIEW CLASS -->
<div id="classView" class="side-panel">
  <h2 id="viewClassName"></h2>
  <div id="viewSubjects"></div>
  <button onclick="closeAll()">Close</button>
</div>

<!-- EDIT CLASS -->
<div id="classEdit" class="side-panel">
  <h2>Edit Class</h2>
  <input id="editClassName">
  <div id="editSubjects"></div>
  <button onclick="saveClassEdit()">Save</button>
  <button onclick="closeAll()">Cancel</button>
</div>

<!-- TEACHER PROFILE -->
<div id="teacherProfile" class="side-panel">
  <h2 id="teacherName"></h2>
  <p id="teacherEmail"></p>
  <ul id="teacherSubjects"></ul>
  <button onclick="closeAll()">Close</button>
</div>

<script>
const firebaseConfig = {

  projectId: "smart-attendance-system-17e89"
};
</script>

<script src="admin.js"></script>
</body>
</html>
