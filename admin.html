<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Dashboard</title>

  <!-- Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

  <!-- Main CSS -->
  <link rel="stylesheet" href="admin.css">
</head>
<body>

<!-- ☰ MOBILE MENU -->
<button class="menu-btn" onclick="toggleSidebar()">
  <span class="material-icons">menu</span>
</button>

<div class="layout">

  <!-- ===== SIDEBAR ===== -->
  <aside class="sidebar">
    <div class="logo">Admin</div>

    <nav>
      <button onclick="nav('dashboard')">
        <span class="material-icons">dashboard</span> Dashboard
      </button>
      <button onclick="nav('classes')">
        <span class="material-icons">school</span> Classes
      </button>
      <button onclick="nav('teachers')">
        <span class="material-icons">person</span> Teachers
      </button>
      <button onclick="nav('approvals')">
        <span class="material-icons">how_to_reg</span> Approvals
      </button>
      <button onclick="nav('settings')">
        <span class="material-icons">settings</span> Settings
      </button>

      <button class="logout" onclick="logout()">
        <span class="material-icons">logout</span> Logout
      </button>
    </nav>
  </aside>

  <!-- ===== MAIN CONTENT ===== -->
  <main class="content">

    <!-- DASHBOARD -->
    <section id="dashboard" class="page active">
      <h1>Dashboard</h1>

      <div class="cards">
        <div class="card">
          <h3>Classes</h3>
          <span id="classCount">0</span>
        </div>
        <div class="card">
          <h3>Teachers</h3>
          <span id="teacherCount">0</span>
        </div>
        <div class="card">
          <h3>Students</h3>
          <span id="studentCount">0</span>
        </div>
      </div>
    </section>

    <!-- CLASSES -->
    <section id="classes" class="page">
      <h1>Classes</h1>

      <div class="form-row">
        <input id="className" placeholder="Class name">
        <button onclick="addClass()">Add</button>
      </div>

      <ul id="classList" class="list"></ul>
    </section>

    <!-- TEACHERS -->
    <section id="teachers" class="page">
      <h1>Teachers</h1>
      <button onclick="addTeacher()">+ Add Teacher</button>

      <ul id="teacherList" class="list"></ul>
    </section>

    <!-- APPROVALS -->
    <section id="approvals" class="page">
      <h1>Approvals</h1>
      <ul id="pendingList" class="list"></ul>
    </section>

    <!-- SETTINGS -->
    <section id="settings" class="page">
      <h1>Settings</h1>

      <div class="form-row">
        <input id="minAttendance" type="number" min="0" max="100">
        <button onclick="saveSettings()">Save</button>
      </div>
    </section>

  </main>
</div>

<!-- ===== PANELS ===== -->
<div id="classPanel" class="panel"></div>
<div id="teacherProfile" class="panel"></div>

<!-- ===== MODAL ===== -->
<div id="modal" class="modal">
  <div class="modal-box">
    <h3 id="modalTitle"></h3>
    <p id="modalText"></p>
    <div class="modal-actions">
      <button onclick="closeModal()">Cancel</button>
      <button id="modalOk" class="danger">Confirm</button>
    </div>
  </div>
</div>

</body>
</html>
