<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard</title>

<link rel="stylesheet" href="admin.css">

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
  <button id="menuBtn" class="hamburger">☰</button>
  <h2>Admin Dashboard</h2>
  <button class="logout">Logout</button>
</div>

<!-- SIDEBAR -->
<div id="sidebar" class="sidebar">
  <button class="nav-btn active" data-page="dashboard">Dashboard</button>
  <button class="nav-btn" data-page="classes">Classes</button>
  <button class="nav-btn" data-page="teachers">Teachers</button>
  <button class="nav-btn" data-page="settings">Settings</button>
</div>

<!-- OVERLAY -->
<div id="overlay"></div>

<!-- MAIN -->
<div class="main">

  <!-- DASHBOARD -->
  <section id="dashboard" class="page active">
    <h3>Welcome 👋</h3>
    <div class="cards">
      <div class="card">Total Classes <span>6</span></div>
      <div class="card">Teachers <span>12</span></div>
      <div class="card">Students <span>240</span></div>
    </div>
  </section>

  <!-- CLASSES -->
  <section id="classes" class="page">
    <h3>Classes</h3>
    <div class="list">
      <div class="list-item">
        FY BCA
        <button onclick="viewClass('FY BCA')">View</button>
        <button onclick="editClass('FY BCA')">Edit</button>
      </div>
    </div>
  </section>

  <!-- TEACHERS -->
  <section id="teachers" class="page">
    <h3>Teachers</h3>
    <div class="list">
      <div class="list-item">
        Prof. Sharma
        <button onclick="viewTeacher('Prof. Sharma')">View</button>
      </div>
    </div>
  </section>

  <!-- SETTINGS -->
  <section id="settings" class="page">
    <h3>Settings</h3>
    <label>Attendance Threshold</label>
    <input type="range" value="75">
    <button class="primary">Save Settings</button>
  </section>

</div>

<!-- PANELS -->
<div id="classPanel" class="panel"></div>
<div id="teacherPanel" class="panel"></div>

<!-- MODAL -->
<div id="modal" class="modal">
  <div class="modal-box">
    <h4>Edit Class</h4>
    <input placeholder="Class name">
    <button class="primary">Save</button>
    <button onclick="closeModal()">Cancel</button>
  </div>
</div>

<script src="admin.js"></script>
</body>
</html>
