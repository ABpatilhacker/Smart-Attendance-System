<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Smart Attendance – Admin Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="admin.css" />
</head>

<body>

<!-- 🍔 HAMBURGER -->
<div class="hamburger" onclick="toggleSidebar()">
  <span></span><span></span><span></span>
</div>

<!-- 📚 SIDEBAR -->
<aside class="sidebar">
  <h2>Smart Attendance</h2>
  <button onclick="nav('dashboard')">Dashboard</button>
  <button onclick="nav('classes')">Classes</button>
  <button onclick="nav('teachers')">Teachers</button>
  <button onclick="nav('approvals')">Approvals</button>
  <button onclick="nav('settings')">Settings</button>
  <button class="danger" onclick="logout()">Logout</button>
</aside>

<!-- 🧠 MAIN -->
<main class="main">

<!-- DASHBOARD -->
<section id="dashboard" class="page active">
  <h1>Admin Dashboard</h1>
  <div class="cards">
    <div class="card"><h3>Classes</h3><span id="classCount">0</span></div>
    <div class="card"><h3>Teachers</h3><span id="teacherCount">0</span></div>
    <div class="card"><h3>Students</h3><span id="studentCount">0</span></div>
  </div>
</section>

<!-- CLASSES -->
<section id="classes" class="page">
  <h1>Classes</h1>
  <input id="className" placeholder="New class name">
  <button onclick="addClass()">Add Class</button>
  <ul id="classList"></ul>
</section>

<!-- TEACHERS -->
<section id="teachers" class="page">
  <h1>Teachers</h1>
  <button onclick="addTeacher()">Add Teacher</button>
  <ul id="teacherList"></ul>
</section>

<!-- APPROVALS -->
<section id="approvals" class="page">
  <h1>Pending Approvals</h1>
  <ul id="pendingList"></ul>
</section>

<!-- SETTINGS -->
<section id="settings" class="page">
  <h1>Settings</h1>
  <label>Minimum Attendance %</label>
  <input type="number" id="minAttendance">
  <button onclick="saveSettings()">Save</button>
</section>

</main>

<!-- 🔲 PANELS -->
<div id="classPanel" class="panel"></div>
<div id="teacherProfile" class="panel"></div>

<!-- ❓ MODAL -->
<div id="modal" class="modal">
  <div class="modal-box">
    <h3 id="modalTitle"></h3>
    <p id="modalText"></p>
    <button id="modalOk">OK</button>
  </div>
</div>

<!-- 🔥 FIREBASE SDKs -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<!-- 🔥 CONFIG -->
<script>
  const firebaseConfig = {
    /* YOUR CONFIG */
  };
</script>

<!-- ✅ LOAD JS LAST (CRITICAL) -->
<script src="admin.js"></script>

</body>
</html>
