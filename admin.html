<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Smart Attendance – Admin Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

  <!-- CSS -->
  <link rel="stylesheet" href="admin.css">
</head>

<body>

<!-- 🍔 HAMBURGER -->
<button class="hamburger" onclick="toggleSidebar()">☰</button>

<!-- 🟣 SIDEBAR -->
<aside class="sidebar">
  <h2>Admin</h2>
  <nav>
    <button onclick="nav('dashboard')">Dashboard</button>
    <button onclick="nav('approvals')">Approvals</button>
    <button onclick="nav('classes')">Classes</button>
    <button onclick="nav('teachers')">Teachers</button>
    <button onclick="nav('settings')">Settings</button>
    <button onclick="logout()" class="danger">Logout</button>
  </nav>
</aside>

<!-- 🟢 MAIN -->
<main class="content">

  <!-- 📊 DASHBOARD -->
  <section id="dashboard" class="page active">
    <h1>Smart Attendance – Admin Dashboard</h1>

    <div class="cards">
      <div class="card">
        <h3>Classes</h3>
        <span id="classCount">0</span>
      </div>
      <div class="card">
        <h3>Teachers</h3>
        <span id="teacherCount">0</span>
      </div>
      <div class="card">
        <h3>Students</h3>
        <span id="studentCount">0</span>
      </div>
    </div>
  </section>

  <!-- 🟡 APPROVALS -->
  <section id="approvals" class="page">
    <h2>Pending Approvals</h2>
    <ul id="pendingList" class="list"></ul>
  </section>

  <!-- 🏫 CLASSES -->
  <section id="classes" class="page">
    <h2>Classes</h2>

    <div class="add-box">
      <input id="className" placeholder="Class name">
      <button onclick="addClass()">Add Class</button>
    </div>

    <ul id="classList" class="list"></ul>
  </section>

  <!-- 👨‍🏫 TEACHERS -->
  <section id="teachers" class="page">
    <h2>Teachers</h2>
    <button onclick="addTeacher()">+ Add Teacher</button>
    <ul id="teacherList" class="list"></ul>
  </section>

  <!-- ⚙️ SETTINGS -->
  <section id="settings" class="page">
    <h2>Settings</h2>
    <label>Minimum Attendance (%)</label>
    <input id="minAttendance" type="number">
    <button onclick="saveSettings()">Save</button>
  </section>

</main>

<!-- 📦 CLASS PANEL -->
<div id="classPanel" class="panel"></div>

<!-- 📦 TEACHER PANEL -->
<div id="teacherProfile" class="panel"></div>

<!-- ❓ MODAL -->
<div id="modal" class="modal">
  <div class="modal-box">
    <h3 id="modalTitle"></h3>
    <p id="modalText"></p>
    <button id="modalOk">Confirm</button>
    <button onclick="modal.classList.remove('show')">Cancel</button>
  </div>
</div>

<!-- 🔔 TOAST CONTAINER -->
<!-- Toasts are injected dynamically -->

<!-- 🔥 FIREBASE CONFIG -->
<script>
  const firebaseConfig = {
    apiKey: "YOUR_KEY",
    authDomain: "YOUR_DOMAIN",
    databaseURL: "YOUR_DB_URL",
    projectId: "YOUR_PROJECT_ID"
  };
</script>
  <script>
  // 🔗 DOM BINDINGS (CRITICAL)
  const classCount = document.getElementById("classCount");
  const teacherCount = document.getElementById("teacherCount");
  const studentCount = document.getElementById("studentCount");

  const pendingList = document.getElementById("pendingList");
  const classList = document.getElementById("classList");
  const teacherList = document.getElementById("teacherList");

  const className = document.getElementById("className");
  const minAttendance = document.getElementById("minAttendance");

  const classPanel = document.getElementById("classPanel");
  const teacherProfile = document.getElementById("teacherProfile");

  const modal = document.getElementById("modal");
  const modalTitle = document.getElementById("modalTitle");
  const modalText = document.getElementById("modalText");
  const modalOk = document.getElementById("modalOk");
  </script>

<!-- 🧠 ADMIN LOGIC -->
<script src="admin.js"></script>

</body>
</html>
