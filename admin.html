<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard</title>

  <!-- CSS -->
  <link rel="stylesheet" href="admin.css" />

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

<!-- ================= TOP BAR ================= -->
<div class="topbar">
  <div class="hamburger" onclick="toggleSidebar(this)">
    <span></span>
    <span></span>
    <span></span>
  </div>
  <h1>Admin Dashboard</h1>
</div>

<!-- ================= SIDEBAR ================= -->
<div class="sidebar">
  <button onclick="showSection('dashboard')">🏠 Dashboard</button>
  <button onclick="showSection('classes')">🏫 Classes</button>
  <button onclick="showSection('assign')">🎯 Assign Subject</button>
  <button onclick="logout()">🚪 Logout</button>
</div>

<!-- ================= MAIN ================= -->
<div class="main">

  <!-- ===== DASHBOARD ===== -->
  <section id="dashboard">

    <div class="stats">
      <div class="glass stat">
        <h3>Classes</h3>
        <span id="classCount">0</span>
      </div>

      <div class="glass stat">
        <h3>Teachers</h3>
        <span id="teacherCount">0</span>
      </div>

      <div class="glass stat">
        <h3>Students</h3>
        <span id="studentCount">0</span>
      </div>
    </div>

    <div class="glass attendance">
      <h3>Attendance Overview</h3>
      <div class="chart-bg">
        <div class="chart-bar" id="attendanceBar"></div>
      </div>
    </div>

  </section>

  <!-- ===== CLASSES ===== -->
  <section id="classes" style="display:none">

    <h2 class="section-title">Classes</h2>

    <div class="class-form">
      <input type="text" id="classNameInput" placeholder="Enter class name" />
      <button onclick="addClass()">Add Class</button>
    </div>

    <div id="classList">
      <!-- Class cards added dynamically -->
    </div>

  </section>

  <!-- ===== SUBJECT → TEACHER ASSIGN ===== -->
  <section id="assign" style="display:none">

    <h2 class="section-title">Assign Subject → Teacher</h2>

    <div class="glass">
      <div class="class-form">
        <input type="text" id="subjectInput" placeholder="Subject name">
        <input type="text" id="teacherInput" placeholder="Teacher name">
        <button onclick="assignSubject()">Assign</button>
      </div>

      <div id="assignmentList">
        <!-- Assignment rows -->
      </div>
    </div>

  </section>

</div>

<!-- ================= TOAST ================= -->
<div id="toastContainer"></div>

<!-- ================= JS ================= -->
<script src="admin.js"></script>

<!-- ================= UI JS ================= -->
<script>
  function toggleSidebar(el) {
    document.querySelector(".sidebar").classList.toggle("active");
    el.classList.toggle("active");
  }

  function showSection(id) {
    document.querySelectorAll("section").forEach(sec => sec.style.display = "none");
    document.getElementById(id).style.display = "block";
    document.querySelector(".sidebar").classList.remove("active");
    document.querySelector(".hamburger").classList.remove("active");
  }
</script>

</body>
</html>
