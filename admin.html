<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Smart Attendance – Admin Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

  <!-- CSS -->
  <link rel="stylesheet" href="admin.css" />
</head>

<body>

<!-- 🍔 HAMBURGER -->
<div class="hamburger" onclick="toggleSidebar()">
  <span></span>
  <span></span>
  <span></span>
</div>

<!-- 📚 SIDEBAR -->
<aside class="sidebar">
  <h2 class="logo">Smart Attendance</h2>
  <nav>
    <button onclick="nav('dashboard')">🏠 Dashboard</button>
    <button onclick="nav('approvals')">🟡 Approvals</button>
    <button onclick="nav('classes')">🏫 Classes</button>
    <button onclick="nav('teachers')">👨‍🏫 Teachers</button>
    <button onclick="nav('settings')">⚙️ Settings</button>
    <button class="danger" onclick="logout()">🚪 Logout</button>
  </nav>
</aside>

<!-- 🧠 MAIN -->
<main class="content">

  <!-- 📊 DASHBOARD -->
  <section id="dashboard" class="page active">
    <h1>Admin Dashboard</h1>

    <div class="stats">
      <div class="card">
        <h3>Classes</h3>
        <p id="classCount">0</p>
      </div>
      <div class="card">
        <h3>Teachers</h3>
        <p id="teacherCount">0</p>
      </div>
      <div class="card">
        <h3>Students</h3>
        <p id="studentCount">0</p>
      </div>
    </div>
  </section>

  <!-- 🟡 APPROVALS -->
  <section id="approvals" class="page">
    <h1>Pending Approvals</h1>
    <ul id="pendingList" class="list"></ul>
  </section>

  <!-- 🏫 CLASSES -->
  <section id="classes" class="page">
    <h1>Classes</h1>

    <div class="add-box">
      <input id="className" placeholder="Class name" />
      <button onclick="addClass()">➕ Add Class</button>
    </div>

    <ul id="classList" class="list"></ul>
  </section>

  <!-- 👨‍🏫 TEACHERS -->
  <section id="teachers" class="page">
    <h1>Teachers</h1>

    <button onclick="addTeacher()">➕ Add Teacher</button>
    <ul id="teacherList" class="list"></ul>
  </section>

  <!-- ⚙️ SETTINGS -->
  <section id="settings" class="page">
    <h1>Settings</h1>

    <label>Minimum Attendance %</label>
    <input id="minAttendance" type="number" min="0" max="100" />
    <button onclick="saveSettings()">💾 Save</button>
  </section>

</main>

<!-- 📘 CLASS PANEL -->
<div id="classPanel" class="panel"></div>

<!-- 👤 TEACHER PANEL -->
<div id="teacherProfile" class="panel"></div>

<!-- ❓ MODAL -->
<div id="modal" class="modal">
  <div class="modal-box">
    <h3 id="modalTitle"></h3>
    <p id="modalText"></p>
    <button id="modalOk">OK</button>
  </div>
</div>

<!-- ✅ ADMIN JS -->
<script src="admin.js"></script>

</body>
</html>
