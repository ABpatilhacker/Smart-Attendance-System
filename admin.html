<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<link rel="stylesheet" href="admin.css">
</head>

<body>

<!-- MENU BUTTON -->
<button class="menu-btn" onclick="toggleSidebar()">☰</button>

<!-- SIDEBAR -->
<div class="sidebar">
  <h2>Admin</h2>
  <button onclick="nav('dashboard')">Dashboard</button>
  <button onclick="nav('classes')">Classes</button>
  <button onclick="nav('teachers')">Teachers</button>
  <button onclick="nav('approvals')">Approvals</button>
  <button onclick="nav('settings')">Settings</button>
  <button class="danger" onclick="logout()">Logout</button>
</div>

<!-- MAIN -->
<div class="main">

  <!-- DASHBOARD -->
  <section id="dashboard" class="page active">
    <h1>Dashboard</h1>
    <div class="cards">
      <div class="card">Classes<br><span id="classCount">0</span></div>
      <div class="card">Teachers<br><span id="teacherCount">0</span></div>
      <div class="card">Students<br><span id="studentCount">0</span></div>
    </div>
  </section>

  <!-- CLASSES -->
  <section id="classes" class="page">
    <h1>Classes</h1>
    <div class="form-row">
      <input id="className" placeholder="Class name">
      <button onclick="addClass()">Add</button>
    </div>
    <ul id="classList" class="list"></ul>
  </section>

  <!-- TEACHERS -->
  <section id="teachers" class="page">
    <h1>Teachers</h1>
    <button onclick="addTeacher()">+ Add Teacher</button>
    <ul id="teacherList" class="list"></ul>
  </section>

  <!-- APPROVALS -->
  <section id="approvals" class="page">
    <h1>Approvals</h1>
    <ul id="pendingList" class="list"></ul>
  </section>

  <!-- SETTINGS -->
  <section id="settings" class="page">
    <h1>Settings</h1>
    <input id="minAttendance" placeholder="Minimum Attendance %">
    <button onclick="saveSettings()">Save</button>
  </section>

</div>

<!-- PANELS -->
<div id="classPanel" class="panel"></div>
<div id="teacherProfile" class="panel"></div>

<!-- MODAL -->
<div id="modal" class="modal">
  <div class="modal-box">
    <h3 id="modalTitle"></h3>
    <p id="modalText"></p>
    <button onclick="closeModal()">Cancel</button>
    <button id="modalOk">Confirm</button>
  </div>
</div>

</body>
</html>
