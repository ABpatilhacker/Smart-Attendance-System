<!DOCTYPE html>
<html>
<head>
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>

<button id="menuBtn" onclick="toggleSidebar()">☰</button>

<aside id="sidebar" class="sidebar">
  <a onclick="nav('dashboard')">Dashboard</a>
  <a onclick="nav('teachers')">Teachers</a>
  <a onclick="nav('classes')">Classes</a>
  <a onclick="nav('settings')">Settings</a>
  <button onclick="logout()">Logout</button>
</aside>

<main>
  <section id="dashboard" class="page active">
    <h2>Dashboard</h2>
    <p>Teachers: <b id="teacherCount">0</b></p>
    <p>Students: <b id="studentCount">0</b></p>
    <p>Classes: <b id="classCount">0</b></p>
  </section>

  <section id="teachers" class="page">
    <h2>Teachers</h2>
    <ul id="teacherList"></ul>
  </section>

  <section id="classes" class="page">
    <h2>Classes</h2>
    <ul id="classList"></ul>
  </section>

  <section id="settings" class="page">
    <h2>Settings</h2>
    <label>Minimum Attendance %</label>
    <input id="minAttendance" type="number">
    <button onclick="saveSettings()">Save</button>
  </section>
</main>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script src="firebaseConfig.js"></script>
<script src="admin.js"></script>

</body>
</html>
