<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Attendance – Admin</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<link rel="stylesheet" href="admin.css">
</head>
<body>

<!-- Overlay -->
<div id="overlay"></div>

<!-- Topbar -->
<header class="topbar">
  <button class="menu-btn" onclick="toggleSidebar()">☰</button>
  <h1 class="topbar-title">Smart Attendance</h1>
  <div class="topbar-actions">
    <button class="theme-btn" onclick="toggleTheme()">🌙</button>
    <button class="logout-btn" onclick="logout()">Logout</button>
  </div>
</header>
<!-- Sidebar -->
<aside id="sidebar" class="sidebar">
  <button onclick="nav('dashboard',this)" class="active">📊 Dashboard</button>
  <button onclick="nav('classes',this)">🏫 Classes</button>
  <button onclick="nav('teachers',this)">👨‍🏫 Teachers</button>
  <button onclick="nav('approvals',this)">✅ Approvals</button>
  <button onclick="nav('settings',this)">⚙ Settings</button>
</aside>

<!-- Main -->
<main class="main">

<!-- Dashboard -->
<section id="dashboard" class="page active">
  <div class="cards">
    <div class="card glow">
      <h3>Classes</h3>
      <span id="classCount">0</span>
    </div>
    <div class="card glow">
      <h3>Teachers</h3>
      <span id="teacherCount">0</span>
    </div>
    <div class="card glow">
      <h3>Students</h3>
      <span id="studentCount">0</span>
    </div>
  </div>
</section>

<!-- Classes -->
<section id="classes" class="page">
  <div class="header-row">
    <input id="className" placeholder="Enter class name">
    <button onclick="addClass()">Add Class</button>
  </div>
  <ul id="classList" class="list"></ul>
</section>

<!-- Teachers -->
<section id="teachers" class="page">
  <ul id="teacherList" class="list"></ul>
</section>

<!-- Approvals -->
<section id="approvals" class="page">
  <ul id="pendingList" class="list"></ul>
</section>

<!-- Settings -->
<section id="settings" class="page">
  <div class="settings-box">
    <label>Minimum Attendance Percentage</label>
    <input id="minAttendance" type="number" min="0" max="100">
    <small>This percentage decides eligibility for exams</small>
    <button onclick="saveSettings()">Save Settings</button>
  </div>
</section>

</main>

<!-- Panels -->
<div id="classPanel" class="panel"></div>
<div id="teacherPanel" class="panel"></div>

<!-- Modal -->
<div id="modal" class="modal">
  <div class="modal-box">
    <h3 id="modalTitle"></h3>
    <p id="modalText"></p>
    <button id="modalOk">OK</button>
  </div>
</div>

</body>
</html>
