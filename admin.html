<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Smart Attendance – Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="admin.css">

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
</head>

<body>

<!-- ================= TOPBAR ================= -->
<header class="topbar">
  <button class="menu-btn" onclick="toggleSidebar()">☰</button>
  <h1>Smart Attendance – Admin</h1>
  <button class="logout" onclick="logout()">Logout</button>
</header>

<!-- ================= SIDEBAR ================= -->
<aside class="sidebar" id="sidebar">
  <button onclick="nav('dashboard')">📊 Dashboard</button>
  <button onclick="nav('classes')">🏫 Classes</button>
  <button onclick="nav('teachers')">👨‍🏫 Teachers</button>
  <button onclick="nav('approvals')">✅ Approvals</button>
  <button onclick="nav('settings')">⚙ Settings</button>
</aside>

<!-- ================= MAIN ================= -->
<main class="main">

  <!-- DASHBOARD -->
  <section id="dashboard" class="page">
    <div class="cards">
      <div class="card">
        <h3>Classes</h3>
        <span id="classCount">0</span>
      </div>
      <div class="card">
        <h3>Teachers</h3>
        <span id="teacherCount">0</span>
      </div>
      <div class="card">
        <h3>Students</h3>
        <span id="studentCount">0</span>
      </div>
    </div>
  </section>

  <!-- CLASSES -->
  <section id="classes" class="page">
    <h2>Manage Classes</h2>

    <div class="add-box">
      <input type="text" id="className" placeholder="Enter class name">
      <button onclick="addClass()">Add Class</button>
    </div>

    <ul id="classList" class="list"></ul>
  </section>

  <!-- TEACHERS -->
  <section id="teachers" class="page">
    <h2>Teachers</h2>
    <ul id="teacherList" class="list"></ul>
  </section>

  <!-- APPROVALS -->
  <section id="approvals" class="page">
    <h2>Pending Approvals</h2>
    <ul id="pendingList" class="list"></ul>
  </section>

  <!-- SETTINGS -->
  <section id="settings" class="page">
    <h2>System Settings</h2>

    <label>Minimum Attendance (%)</label>
    <input type="number" id="minAttendance" min="1" max="100">
    <button onclick="saveSettings()">Save Settings</button>
  </section>

</main>

<!-- ================= MODAL ================= -->
<div id="modal" class="modal">
  <div class="modal-box">
    <h3 id="modalTitle"></h3>
    <p id="modalText"></p>
    <button id="modalOk">OK</button>
  </div>
</div>

<script src="admin.js"></script>

</body>
</html>
